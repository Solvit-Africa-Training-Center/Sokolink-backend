paths:
 /admin/login:
    post:
      tags:
        - Admin
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AdminUserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

/admin/wholesalers:
    get:
      tags:
        - Admin
      summary: List all wholesalers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of wholesalers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WholesalerResponse'

/admin/wholesaler/{id}/approve:
    patch:
      tags:
        - Admin
      summary: Approve a wholesaler
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wholesaler approved
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

/admin/wholesaler/{id}/reject:
    patch:
      tags:
        - Admin
      summary: Reject a wholesaler
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wholesaler rejected
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

/admin/retailers:
    get:
      tags:
        - Admin
      summary: List all retailers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of retailers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetailerResponse'

/admin/products:
    get:
      tags:
        - Admin
      summary: List all products
      security:
        - bearerAuth: []
      parameters:
        - name: wholesalerId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of products
   
/admin/user/{id}:
  put:
    tags:
      - Admin
    summary: Update Wholesaler or Retailer
    description: Admin can update user details (wholesaler or retailer).
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User ID (UUID)
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UserUpdateRequest.yaml'
    responses:
      '200':
        description: User updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/UserResponse.yaml'
      '400':
        description: Invalid request
      '401':
        description: Unauthorized
      '404':
        description: User not found
delete:
    tags:
      - Admin
    summary: Delete Wholesaler or Retailer
    description: Admin can delete a wholesaler or retailer account.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User ID (UUID)
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: User deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "User deleted successfully"
      '401':
        description: Unauthorized
      '404':
        description: User not found
